format_version: 2
# CNN PLANA de UNA capa y UN SOLO kernel 7x7, encargada por el dueno el
# 2026-09-04: «un estudio similar al de 2k7-sinpadding, pero con un unico
# kernel».
#
# ES EL TERCER PUNTO DE UNA SERIE, y por eso existe
#   channels: [4] -> [2] -> [1], todo lo demas igual. Con `padding=0` el mapa
#   sale 14x14, asi que la cabeza recibe `canales x 14 x 14`:
#
#     4k7 zeros        1.600 features   f1 0,840   (con relleno, 20x20)
#     2k7 zeros          800 features   f1 0,739   (con relleno, 20x20)
#     2k7 sin relleno    392 features   f1 0,656
#     1k7 sin relleno    196 features   <- este
#
#   El README de `cnn-plana-2k7-sinpadding` observo que cada vez que se parte el
#   numero de features por la mitad se pierden ~0,09 de f1, y dejo escrito que
#   eso era «una coincidencia numerica compatible con dos historias». Este punto
#   la pone a prueba: es otra mitad exacta, y ademas la unica que se puede hacer
#   SIN volver a tocar el relleno.
#
# QUE SE CONSERVA, Y POR QUE ESO ES EL EXPERIMENTO
#   Todo lo demas es copia literal de `plana-20-2k7.yaml`: la geometria
#   (fovea_px 16, border_px 8, border_reduce 4, overlap_fovea_px 7 -> vista
#   20x20), los 2 canales de entrada (`mask_channel: coverage`), la cabeza de 12
#   salidas y la receta. Comparar dos redes que ven o predicen cosas distintas no
#   compara nada.
#
# QUE CAMBIA -- UNA LINEA
#   channels: [2] -> [1]
#
# ⚠ El relleno NO se quita desde aqui: `builder.py` lo calcula como `k//2` y no
#   es un dato. Lo quita el codigo LOCAL del experimento
#   (`experimentos/2026-09-04-cnn-plana-1k7-sinpadding/nn/red_local.py`), por la
#   instruccion del dueno de que los experimentos no tocan produccion. Esta
#   config, tal cual, describe la red CON relleno; sirve para las dos y es lo que
#   mantiene el parche en un solo sitio.
#
# ⚠ `k_periph`, `s_periph` y `merge` NO APLICAN con `regions: single` y la puerta
#   no los valida; se dejan escritos porque el formato los pide.
#
# ⚠ NADA DE ESTO ESTA MEDIDO COMO MEJORA: los parametros son los OPTIMOS DE LA
#   FOVEADA y nadie los ha ajustado a una plana de una capa.
regions: single
fovea_px: 16
border_px: 8
border_reduce: 4
overlap_fovea_px: 7
overlap_border_px: 0
n_layers: 1
k_center: 7
k_periph: 3
s_center: 1
s_periph: 1
channels: [1]
merge: concat
pool_mode: avg
pad_mode: edge
edge_inputs: pad
mask_channel: coverage
