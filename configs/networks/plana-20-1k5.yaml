format_version: 2
# CNN PLANA de UNA capa y UN SOLO kernel 5x5, encargada por el dueno el
# 2026-09-04: «un estudio similar al de 2k7-sinpadding, pero con un unico
# kernel».
#
# MUEVE EL TAMANO DEL KERNEL, no el numero de kernels, y por eso existe
#   Es `plana-20-1k7.yaml` con `k_center: 7 -> 5`. Todos los puntos anteriores de
#   la serie movian CUANTOS kernels hay; este mueve COMO DE GRANDE es el unico
#   que queda.
#
# ⚠⚠ Y NO es «lo mismo con un kernel mas pequeno»: sin relleno, un kernel mas
#   pequeno RECORTA MENOS, asi que la cabeza crece.
#
#     k=7 sin relleno:  valid 14x14 -> 196 features · L1  99 params
#     k=5 sin relleno:  valid 16x16 -> 256 features · L1  51 params
#
#   O sea que las dos cosas se mueven a la vez y EN SENTIDOS OPUESTOS: +31 % de
#   features (que por la tendencia medida deberia SUBIR el f1) y la mitad de
#   parametros en L1 con un campo receptivo de 5 px en vez de 7 (que deberia
#   BAJARLO). Eso no es un defecto del diseno: es lo que hace que el resultado
#   distinga cual de los dos manda. El criterio, escrito antes de correr nada,
#   esta en el experimento.
#
# QUE SE CONSERVA, Y POR QUE ESO ES EL EXPERIMENTO
#   Todo lo demas es copia literal de `plana-20-2k7.yaml`: la geometria
#   (fovea_px 16, border_px 8, border_reduce 4, overlap_fovea_px 7 -> vista
#   20x20), los 2 canales de entrada (`mask_channel: coverage`), la cabeza de 12
#   salidas y la receta. Comparar dos redes que ven o predicen cosas distintas no
#   compara nada.
#
# QUE CAMBIA -- UNA LINEA
#   channels: [2] -> [1]
#
# ⚠ El relleno NO se quita desde aqui: `builder.py` lo calcula como `k//2` y no
#   es un dato. Lo quita el codigo LOCAL del experimento
#   (`experimentos/2026-09-04-cnn-plana-1k7-sinpadding/nn/red_local.py`), por la
#   instruccion del dueno de que los experimentos no tocan produccion. Esta
#   config, tal cual, describe la red CON relleno; sirve para las dos y es lo que
#   mantiene el parche en un solo sitio.
#
# ⚠ `k_periph`, `s_periph` y `merge` NO APLICAN con `regions: single` y la puerta
#   no los valida; se dejan escritos porque el formato los pide.
#
# ⚠ NADA DE ESTO ESTA MEDIDO COMO MEJORA: los parametros son los OPTIMOS DE LA
#   FOVEADA y nadie los ha ajustado a una plana de una capa.
regions: single
fovea_px: 16
border_px: 8
border_reduce: 4
overlap_fovea_px: 7
overlap_border_px: 0
n_layers: 1
k_center: 5
k_periph: 3
s_center: 1
s_periph: 1
channels: [1]
merge: concat
pool_mode: avg
pad_mode: edge
edge_inputs: pad
mask_channel: coverage
